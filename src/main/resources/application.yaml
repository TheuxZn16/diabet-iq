spring:
  application:
    name: diabet-iq

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${BREVO_SMTP_USERNAME:}
    password: ${BREVO_SMTP_KEY:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS}

  email-verificacao:
    url: ${EMAIL_VERIFICATION_URL:http://localhost:8080/api/v1/usuario/verificar-email}
    expiracao-horas: ${EMAIL_VERIFICATION_EXPIRATION_HOURS:24}

app:
  mail:
    from: ${MAIL_FROM}
